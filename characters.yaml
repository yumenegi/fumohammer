      - { name: Perfect Cherry Blossom, cost: 8, uses: 1, tier: 3, range: 40, effect: "7 damage; also applies Frozen for 1 round. Highest all-in single Spell Card in the roster" }

# The six-artifact pool from README.md Section 8.3.1.
artifacts:
  - { name: "Buddha's Stone Bowl", effect: "+2 max HP to carrier" }
  - { name: Jeweled Branch of Hourai, effect: "+1 Speed to carrier" }
  - { name: Robe of the Fire Rat, effect: "+1 Defense to carrier" }
  - { name: "Dragon's Neck Jewel", effect: "+1 flat damage on carrier's attacks" }
  - { name: "Swallow's Cowrie Shell", effect: "+2 max Spirit to carrier" }
  - { name: Kaguya's Wrath, effect: "Carrier's attacks can't be Grazed; a Nat 1 against them is an ordinary success, not a Block" }

# Duration-tick rules from README.md Section 7.6. hp/speed/defense deltas apply once per Start of Round.
statusEffects:
  Frozen: {}
  Frostbite: { hp: -1, speed: -1 }
  Burnt: { hp: -2 }
  Sealed: {}
  Cursed: {}
  Blessed: { hp: 1 }
  Weaken: { defense: -1 }
