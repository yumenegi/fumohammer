# Single source of truth for character/artifact/status data.
# Feeds both the webapp (app.js) and codex.md (via generate-codex.js).
characters:
  - name: Cirno
    nativeFaction: Gensokyolites
    zoneAffinity: None
    lore: "An ice fairy of the Misty Lake, convinced she's the strongest thing in Gensokyo. Mostly right about the \"strongest fairy\" part."
    hp: 7
    spirit: 6
    speed: 8
    defense: 3
    danmaku:
      - { name: Icicle Fall, tier: 1, cost: 1, range: 20, damage: 2, notes: Freely grazeable poke }
      - { name: "Ice Sign: Icicle Machine Gun", tier: 2, cost: 3, range: 35, damage: 4, notes: Rapid volley }
    melee:
      - { name: Frozen Fist, tier: 1, cost: 1, damage: 3, notes: Close-range ice punch }
    spellCards:
      - { name: Perfect Freeze, cost: 6, uses: 1, tier: 3, range: 35, effect: "6 damage to one target; also applies Frozen for 1 round (see README.md Section 7.6)" }

  - name: Reimu Hakurei
    nativeFaction: Gensokyolites
    zoneAffinity: None
    lore: "The shrine maiden of the Hakurei Shrine, sitting on the border of Gensokyo. Deals with incidents because someone has to, and it's usually faster than waiting for an explanation."
    hp: 9
    spirit: 8
    speed: 3
    defense: 8
    danmaku:
      - { name: Homing Amulet, tier: 1, cost: 1, range: 35, damage: 2, notes: Curves slightly toward its target }
      - { name: Persuasion Needle, tier: 2, cost: 3, range: 35, damage: 4, notes: Rapid needle volley }
    melee:
      - { name: Gohei Strike, tier: 1, cost: 1, damage: 3, notes: Exorcism wand strike }
    spellCards:
      - { name: Fantasy Seal, cost: 5, uses: 2, tier: 3, range: 40, effect: "5 damage to one target. (Canonically a spread attack; single-target for now since AoE isn't supported yet — see README.md Section 6.2)" }

  - name: Marisa Kirisame
    nativeFaction: Gensokyolites
    zoneAffinity: None
    lore: "A human magician who'll borrow anything not nailed down, including magic. Prefers to solve problems by pointing a very large laser at them."
    hp: 7
    spirit: 9
    speed: 8
    defense: 4
    danmaku:
      - { name: Magic Missile, tier: 1, cost: 1, range: 35, damage: 2, notes: Basic bolt }
