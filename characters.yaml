    spellCards:
      - { name: Yasaka's Divine Wind, cost: 6, uses: 1, tier: 3, range: 35, effect: "4 damage to one target; Sanae also gains Blessed for 2 rounds" }

  - name: Yorigami Shion
    nativeFaction: Gensokyolites
