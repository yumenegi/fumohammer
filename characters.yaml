  - name: Yuyuko Saigyouji
    nativeFaction: Gensokyolites
    zoneAffinity: None
    lore: "Ghost princess of Hakugyokurou, cheerfully obsessed with death, and one of the most powerful beings in Gensokyo whenever she can be bothered to act like it."
    hp: 9
