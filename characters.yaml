    melee:
      - { name: Broom Whack, tier: 1, cost: 1, damage: 2, notes: "Weakest melee in the roster — Marisa isn't built for close range" }
    spellCards:
      - { name: Master Spark, cost: 7, uses: 1, tier: 3, range: 50, effect: "8 damage to one target (highest single hit in the roster). (Canonically a piercing beam; single-target for now since AoE isn't supported yet — see README.md Section 6.2). Costs nearly all of Marisa's Spirit cap in one shot" }

  - name: Tewi Inaba
    nativeFaction: Gensokyolites
    zoneAffinity: "Bamboo Forest of the Lost — Tewi lives in Eientei, right on its doorstep. While occupying the Bamboo Forest, she gains an additional +1 Spirit at Start of Round, stacking with the zone's own bonus (README.md Section 8.3)"
    lore: "An old, powerful rabbit youkai posing as a minor resident of Eientei. Controls luck — usually other people's, and usually for the worse."
    hp: 7
    spirit: 7
    speed: 9
    defense: 3
    danmaku:
      - { name: "Lucky Rabbit's Foot", tier: 1, cost: 1, range: 35, damage: 2, notes: Basic poke }
      - { name: Ill-Omened Fortune, tier: 2, cost: 3, range: 35, damage: 3, notes: Also applies Cursed for 1 round }
    melee:
      - { name: Spade Dig, tier: 1, cost: 1, damage: 3, notes: Quick strike from a tunnel }
    spellCards:
      - { name: Beckoning of the Unlucky, cost: 5, uses: 1, tier: 3, range: 35, effect: "4 damage; also applies Cursed for 2 rounds" }

  - name: Aya Shameimaru
    nativeFaction: Gensokyolites
    zoneAffinity: None
    lore: "Tengu reporter for the Bunbunmaru Newspaper, and the fastest thing in Gensokyo when she's not busy embellishing a story."
    hp: 6
    spirit: 6
    speed: 10
    defense: 3
    danmaku:
